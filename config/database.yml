default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: password
  host: db # имя сервиса из docker-compose.yml

development:
  <<: *default
  database: smartroutes_development

test:
  <<: *default
  database: smartroutes_test

production:
  <<: *default
  database: smartroutes_production
